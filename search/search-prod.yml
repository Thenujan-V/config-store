spring:
  data:
    elasticsearch:
      cluster-name: elasticsearch
      cluster-nodes: elasticsearch:9200
      repositories:
        enabled: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://discovery-service:8761/eureka
    # healthcheck:
    #   enabled: true
  instance:
    preferIpAddress: true
    instance-id: ${spring.application.name}-${random.int}
    # hostname: localhost

member:
  rent:
    min: 8
    max: 31
  price:
    discount: 3
vehicle:
  default:
    model: cross over
duration: all

openapi:
  service:
    url: http://api-service:8080

es:
  index:
    bulk-batch-size: 50

auradocs:
  storage:
    provider: ${AURADOCS_STORAGE_PROVIDER:local}   # local | s3 | azure
    archive-identity: archive_1
    pending-identity: pending_docs
    thumbs-identity: thumbs
    local:
      root-path: /var/tmp/auradocsv4
      temp-path: /var/tmp/auradocsv4/temp
      public-base-url: ${AURADOCS_LOCAL_PUBLIC_URL:http://192.168.114.174/}
      public-path-prefix: /files
      secure-link-secret: ${AURADOCS_SECURE_LINK_SECRET:vrst4cfer3h345y7yugfyuhkjpouttdseawrzfgvmert44gtth6qwedavtu43ew}
    s3:
      endpoint: ${AURADOCS_S3_ENDPOINT:} # blank for AWS S3; http://localhost:9000 for MinIO
      region: ${AWS_REGION:ap-south-1}
      bucket: ${AWS_S3_BUCKET:}
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
      path-style-access: true                       # required for MinIO
      multipart-threshold-bytes: 16777216
    azure:
      connection-string: ${AZURE_STORAGE_CONNECTION_STRING:}
      container: ${AZURE_BLOB_CONTAINER:}
      create-container-if-missing: false            # search is read-only; the writers create it
  thumbs:
    url-ttl: PT30M          # how long a signed thumbnail URL stays valid
    url-cache-bucket: PT15M # expiry is rounded up to this, so URLs stay browser-cacheable
